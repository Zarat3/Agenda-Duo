  <rect x="71" y="62" width="18" height="14" rx="3" fill="#800000"/>
  <rect x="95" y="62" width="18" height="14" rx="3" fill="#800000"/>
  <rect x="47" y="81" width="18" height="14" rx="3" fill="#800000"/>
